<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocos 2D - Minecraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="game"></canvas>

  <div id="help">
    <b>BLOCOS 2D</b><br>
    A / D ou ← → : andar<br>
    W / Espaço / ↑ : pular<br>
    Clique esquerdo: minerar<br>
    Clique direito: construir<br>
    1-7 ou roda do mouse: escolher bloco
  </div>

  <div id="hotbar"></div>

  <script src="script.js"></script>
</body>
</html>
